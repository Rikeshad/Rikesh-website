<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Future Project | Rikesh</title>

  <!-- CSS used only for the Future Project page -->
  <link
    rel="stylesheet"
    href="../css/futureproject.css"
  >
</head>

<body>

  <!-- =====================================================
       LOADING SCREEN
       This is shown first when the page opens
       ===================================================== -->

  <section class="future-loader" id="futureLoader">

    <!-- Small information at the top -->
    <div class="loader-top">
      <span>RIKESH / FUTURE PROJECT</span>
      <span>2026</span>
    </div>


    <!-- Main large loading animation -->
    <div class="loader-center">

      <!-- Rotating outer circle -->
      <div class="loader-circle">

        <!-- Percentage shown inside the circle -->
        <span
          class="loader-percentage"
          id="loaderPercentage"
        >
          0%
        </span>

      </div>

      <!-- Large loading text -->
      <h1 class="loading-title">
        LOADING
      </h1>

      <p class="loading-text">
        Preparing something new...
      </p>

    </div>


    <!-- Progress bar at the bottom -->
    <div class="loader-bottom">

      <div class="loader-info">
        <span>LOADING EXPERIENCE</span>
        <span>PLEASE WAIT</span>
      </div>

      <div class="progress-track">
        <div
          class="progress-bar"
          id="progressBar"
        ></div>
      </div>

    </div>

  </section>


  <!-- =====================================================
       THANK YOU SCREEN
       Appears after the loading animation finishes
       ===================================================== -->

  <main
    class="thank-you-screen"
    id="thankYouScreen"
  >

    <!-- Decorative background grid -->
    <div class="background-grid"></div>


    <!-- Top navigation -->
    <nav class="future-nav">

      <a href="../index.html">
        RIKESH ADHIKARI
      </a>

      <a href="../index.html#projects">
        PROJECTS
      </a>

    </nav>


    <!-- Main thank-you message -->
    <section class="thank-you-content">

      <span class="future-label">
        03 / FUTURE PROJECT
      </span>


      <!-- Each line is separate so it can animate individually -->
      <h1 class="thank-you-title">

        <span class="message-line">
          <span class="message-inner">
            THANK
          </span>
        </span>

        <span class="message-line">
          <span class="message-inner thin">
            YOU FOR
          </span>
        </span>

        <span class="message-line">
          <span class="message-inner outline">
            VISITING.
          </span>
        </span>

      </h1>


      <!-- Bottom message -->
      <div class="future-bottom">

        <div class="future-description">

          <p>
            Something new is being created.
          </p>

          <p class="coming-soon">
            FUTURE PROJECT — COMING SOON
          </p>

        </div>


        <!-- Return to Projects -->
        <a
          href="../index.html#projects"
          class="back-button"
        >
          BACK TO PROJECTS
          <span>↗</span>
        </a>

      </div>

    </section>

  </main>


  <!-- JavaScript controls loading percentage and transitions -->
  <script src="../js/futureproject.js"></script>

</body>

</html>
